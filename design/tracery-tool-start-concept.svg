<?xml version="1.0" encoding="UTF-8"?>
<!-- Concept asset only — not wired into the application. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="花窗碎玻璃开始方式选择界面">
  <defs>
